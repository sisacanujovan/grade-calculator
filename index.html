<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>
                <i class="fas fa-graduation-cap"></i>
                Student Grade Calculator
            </h1>

            <p class="subtitle">
                Enter marks for each subject (0 - 100)
            </p>

            <div class="subjects">

                <div class="subject">
                    <label>Mathematics</label>
                    <input type="number" id="sub1" min="0" max="100" placeholder="Enter Marks">
                </div>

                <div class="subject">
                    <label>Physics</label>
                    <input type="number" id="sub2" min="0" max="100" placeholder="Enter Marks">
                </div>

                <div class="subject">
                    <label>Chemistry</label>
                    <input type="number" id="sub3" min="0" max="100" placeholder="Enter Marks">
                </div>

                <div class="subject">
                    <label>English</label>
                    <input type="number" id="sub4" min="0" max="100" placeholder="Enter Marks">
                </div>

                <div class="subject">
                    <label>Computer Science</label>
                    <input type="number" id="sub5" min="0" max="100" placeholder="Enter Marks">
                </div>

                <div class="subject">
                    <label>Biology</label>
                    <input type="number" id="sub6" min="0" max="100" placeholder="Enter Marks">
                </div>

            </div>

            <div class="buttons">

                <button id="calculateBtn">
                    <i class="fas fa-calculator"></i>
                    Calculate
                </button>

                <button id="resetBtn">
                    <i class="fas fa-rotate-right"></i>
                    Reset
                </button>

            </div>

            <div class="result">

                <h2>Result</h2>

                <div class="result-box">

                    <p>Total Marks</p>
                    <h3 id="total">0 / 600</h3>

                </div>

                <div class="result-box">

                    <p>Average</p>
                    <h3 id="average">0%</h3>

                </div>

                <div class="result-box">

                    <p>Grade</p>
                    <h3 id="grade">-</h3>

                </div>

                <div class="result-box">

                    <p>Status</p>
                    <h3 id="status">-</h3>

                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
